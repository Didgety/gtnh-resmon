name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua 5.3
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3

      - name: Validate VERSION
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path("VERSION")
          if not path.is_file():
              sys.exit("VERSION file is missing")

          raw = path.read_text(encoding="utf-8")
          lines = raw.splitlines()

          if len(lines) != 1:
              sys.exit("VERSION must contain exactly one line")

          version = lines[0].strip()

          pattern = (
              r"[0-9]+\.[0-9]+\.[0-9]+"
              r"(?:-[0-9A-Za-z.-]+)?"
              r"(?:\+[0-9A-Za-z.-]+)?"
          )

          if not re.fullmatch(pattern, version):
              sys.exit(f"Invalid VERSION: {version!r}")

          print(f"VERSION={version}")
          PY

      - name: Validate required package files
        run: |
          set -euo pipefail

          for file in \
            VERSION \
            installer.lua \
            setup.lua \
            src/resmon.lua \
            src/resmonctl.lua \
            src/resmon_common.lua \
            src/resmon_rc.lua
          do
            test -s "$file" || {
              echo "Required file missing or empty: $file"
              exit 1
            }
          done

      - name: Check Lua syntax
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Checking $file"
            luac5.3 -p "$file"
          done < <(find . -type f -name '*.lua' -print0)

      - name: Reject hardcoded runtime versions
        run: |
          set -euo pipefail

          if grep -RInE \
            'PROGRAM_VERSION[[:space:]]*=[[:space:]]*["'\''][0-9]' \
            src
          then
            echo
            echo "Runtime version must come from VERSION via common.getVersion()."
            exit 1
          fi

      - name: Verify runtime reads installed VERSION
        run: |
          set -euo pipefail

          grep -Fq \
            'destination = "/usr/share/resmon/VERSION"' \
            setup.lua

          grep -Fq \
            'local PROGRAM_VERSION = common.getVersion()' \
            src/resmon.lua

          grep -Fq \
            'M.VERSION_PATH = "/usr/share/resmon/VERSION"' \
            src/resmon_common.lua